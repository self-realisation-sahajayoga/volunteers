    .add-volunteer-form button {

    .resp-list { list-style: none; font-size: 0.85rem; color: #3a2a1e; }

    .btn-brown:hover { background: #52321c; }

      .summary-strip { flex-direction: column; gap: 1rem; }
      .manage-card { padding: 1rem 1.2rem; }
      .manage-row label { flex: 1 1 100%; }
    }
  </style>
</head>

    function getEventCoordinationTeam() {
      const coordTeam =
        teamsStore.find(t => t.id === 'team7') ||
        teamsStore.find(t => t.name.toLowerCase().includes('event operations') || t.name.toLowerCase().includes('coordination'));

      const teamName = coordTeam?.name || 'Event Operations & Overall Coordination Team';
      const members = coordTeam
        ? (volunteersStore[coordTeam.id] || [])
        : (INITIAL_VOLUNTEERS.team7 || []);

      return { teamName, members };
    }

    function formatTelHref(mobile) {
      const digits = String(mobile || '').split('/')[0].replace(/[^0-9+]/g, '');
      return digits ? `tel:${digits}` : '';
    }

    function createCoordinationBanner(compact = false) {
      const { teamName, members } = getEventCoordinationTeam();
      const banner = document.createElement('div');
      banner.className = 'coord-banner';
      if (compact) {
        banner.style.maxWidth = '1200px';
        banner.style.margin = '0 auto 1.2rem';
      }

      const itemsHtml = members.length > 0
        ? members.map(m => {
            const cleanMob = (m.mobile || '').trim();
            const href = formatTelHref(cleanMob);
            const phoneHtml = cleanMob
              ? (href
                  ? `<a class="coord-phone" href="${escapeHtml(href)}">📞 ${escapeHtml(cleanMob)}</a>`
                  : `<span class="coord-phone">📞 ${escapeHtml(cleanMob)}</span>`)
              : `<span class="coord-phone" style="opacity:0.65;">No number</span>`;
            return `<span class="coord-chip"><strong>${escapeHtml(m.name)}</strong> ${phoneHtml}</span>`;
          }).join('')
        : `<span style="color:#8b7a6b;font-style:italic;">No members listed yet.</span>`;

      banner.innerHTML = `
        <span class="coord-banner-title">🎯 ${escapeHtml(teamName)}</span>
        <div class="coord-list">${itemsHtml}</div>
      `;
      return banner;
    }

    function refreshAllCoordinationBanners() {
      document.querySelectorAll('.coord-banner').forEach(el => {
        const isCompact = el.style.maxWidth === '1200px';
        const fresh = createCoordinationBanner(isCompact);
        el.replaceWith(fresh);
      });
    }

    function showToast(msg, type = 'info', duration = 3000) {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity 0.3s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, duration);
    }

    /* ============================================
       SUPABASE DATA ACCESS
    ============================================ */
    async function fetchTeams() {
      const { data, error } = await supabaseClient
        .from('teams')
        .select('*')
        .order('sort_order', { ascending: true });
      if (error) throw error;
      return data || [];
    }

    async function fetchAllVolunteers() {
      const { data, error } = await supabaseClient
        .from('volunteers')
        .select('*')
        .order('sort_order', { ascending: true });
      if (error) throw error;
      return data || [];
    }

    async function loadDataFromSupabase() {
      showLoading(true);
      try {
        let teams = await fetchTeams();
        if (teams.length === 0) {
          await seedDefaultData();
          teams = await fetchTeams();
        }
        const vols = await fetchAllVolunteers();

        teamsStore = teams.map(t => ({
          id: t.id,
          name: t.name,
          required: t.required,
          responsibilities: Array.isArray(t.responsibilities) ? t.responsibilities : []
        }));

        volunteersStore = {};
        teamsStore.forEach(t => { volunteersStore[t.id] = []; });
        vols.forEach(v => {
          if (!volunteersStore[v.team_id]) volunteersStore[v.team_id] = [];
          volunteersStore[v.team_id].push({
            dbId: v.id,
            name: v.name,
            mobile: v.mobile || '',
            workArea: v.work_area || ''
          });
        });
      } catch (err) {
        console.error(err);
        showToast('Load failed: ' + err.message, 'error');
      } finally {
        showLoading(false);
      }
    }

    async function seedDefaultData() {
      const teamRows = DEFAULT_TEAMS.map((t, i) => ({
        id: t.id,
        name: t.name,
        required: t.required,
        responsibilities: t.responsibilities,
        sort_order: i
      }));
      const { error: teamErr } = await supabaseClient.from('teams').insert(teamRows);
      if (teamErr) throw teamErr;

      const volRows = [];
      DEFAULT_TEAMS.forEach(t => {
        const vols = INITIAL_VOLUNTEERS[t.id] || [];
        vols.forEach((v, i) => {
          volRows.push({
            team_id: t.id,
            name: v.name,
            mobile: v.mobile || '',
            work_area: v.workArea || '',
            sort_order: i
          });
        });
      });
      if (volRows.length > 0) {
        const { error: volErr } = await supabaseClient.from('volunteers').insert(volRows);
        if (volErr) throw volErr;
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errEl.textContent = error.message;
        btn.disabled = false;
        btn.textContent = 'Login';
        return;
      }
      currentUser = data.user;
      isAdmin = currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
      await showApp();
    });

      document.getElementById('loginOverlay').style.display = 'none';

    function renderTabsAndPanels() {
      const tabsNav = document.getElementById('tabsNav');
      const panelsContainer = document.getElementById('tabPanels');
      tabsNav.innerHTML = '';
      panelsContainer.innerHTML = '';

      const dashBtn = document.createElement('button');
      dashBtn.className = 'tab-btn active';
      dashBtn.dataset.teamId = 'dashboard';
      dashBtn.textContent = '📊 Dashboard';
      dashBtn.addEventListener('click', () => switchTab('dashboard'));
      tabsNav.appendChild(dashBtn);

      const dashPanel = document.createElement('div');
      dashPanel.className = 'tab-panel active';
      dashPanel.id = 'panel-dashboard';
      dashPanel.appendChild(createDashboard());
      panelsContainer.appendChild(dashPanel);

      teamsStore.forEach((team, index) => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.dataset.teamId = team.id;
        btn.textContent = `${index + 1}. ${team.name}`;
        btn.addEventListener('click', () => switchTab(team.id));
        tabsNav.appendChild(btn);

        const panel = document.createElement('div');
        panel.className = 'tab-panel';
        panel.id = `panel-${team.id}`;
        panel.appendChild(createCoordinationBanner(true));
        panel.appendChild(createTeamCard(team));
        panelsContainer.appendChild(panel);
      });

      const manageBtn = document.createElement('button');
      manageBtn.className = 'tab-btn';
      manageBtn.dataset.teamId = 'manage';
      manageBtn.textContent = '⚙️ Manage';
      manageBtn.addEventListener('click', () => switchTab('manage'));
      tabsNav.appendChild(manageBtn);

      const managePanel = document.createElement('div');
      managePanel.className = 'tab-panel';
      managePanel.id = 'panel-manage';
      managePanel.appendChild(createManagePanel());
      panelsContainer.appendChild(managePanel);
    }

    function switchTab(teamId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      const btn = document.querySelector(`.tab-btn[data-team-id="${teamId}"]`);
      if (btn) btn.classList.add('active');
      const panel = document.getElementById(`panel-${teamId}`);
      if (panel) panel.classList.add('active');
      refreshAllCoordinationBanners();
      if (teamId === 'dashboard') refreshDashboard();
      if (teamId === 'manage') refreshManagePanel();
    }

    function createDashboard() {
      const wrap = document.createElement('div');
      wrap.id = 'dashboardWrap';

      wrap.appendChild(createCoordinationBanner(false));

      const summary = document.createElement('div');
      summary.className = 'summary-strip';
      summary.id = 'dashSummary';
      wrap.appendChild(summary);

      const title = document.createElement('div');
      title.className = 'dash-section-title';
      title.style.marginTop = '1.8rem';
      title.innerHTML = '📋 Team-wise Volunteer Count';
      wrap.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'dashboard-grid';
      grid.id = 'dashGrid';
      wrap.appendChild(grid);

      setTimeout(() => refreshDashboard(), 0);
      return wrap;
    }

    function refreshDashboard() {
      const summary = document.getElementById('dashSummary');
      const grid = document.getElementById('dashGrid');
      if (!summary || !grid) return;

      let totalCurrent = 0, totalRequired = 0;
      teamsStore.forEach(t => {
        totalCurrent += (volunteersStore[t.id] || []).length;
        totalRequired += t.required || 0;

      const teamsMeeting = teamsStore.filter(t => (volunteersStore[t.id] || []).length >= t.required).length;

    /* ============================================
       ADD / EDIT / MOVE / REMOVE VOLUNTEERS
    ============================================ */
    function resolveTargetTeamId(rawInput, fallbackTeamId) {
      const cleaned = String(rawInput ?? '').trim();
      if (!cleaned) return fallbackTeamId;

      const byId = teamsStore.find(t => t.id.toLowerCase() === cleaned.toLowerCase());
      if (byId) return byId.id;

      const num = parseInt(cleaned, 10);
      if (!isNaN(num) && String(num) === cleaned && num >= 1 && num <= teamsStore.length) {
        return teamsStore[num - 1].id;
      }

      const byNameExact = teamsStore.find(t => t.name.toLowerCase() === cleaned.toLowerCase());
      if (byNameExact) return byNameExact.id;

      const byNamePartial = teamsStore.find(t => t.name.toLowerCase().includes(cleaned.toLowerCase()));
      if (byNamePartial) return byNamePartial.id;

      return null;
    }

    async function moveVolunteerToTeam(volObj, sourceTeamId, targetTeamId, updatedFields = null) {
      const targetList = volunteersStore[targetTeamId] || [];
      const nextSortOrder = targetList.length;

      const payload = {
        team_id: targetTeamId,
        sort_order: nextSortOrder
      };
      if (updatedFields) {
        payload.name = updatedFields.name;
        payload.mobile = updatedFields.mobile;
        payload.work_area = updatedFields.workArea;
      }

      const { error } = await supabaseClient
        .from('volunteers')
        .update(payload)
        .eq('id', volObj.dbId);
      if (error) throw error;

      // Re-index remaining volunteers in source team so order stays clean
      const remaining = (volunteersStore[sourceTeamId] || []).filter(item => item.dbId !== volObj.dbId);
      for (let i = 0; i < remaining.length; i++) {
        const { error: reorderErr } = await supabaseClient
          .from('volunteers')
          .update({ sort_order: i })
          .eq('id', remaining[i].dbId);
        if (reorderErr) throw reorderErr;
      }
    }

    async function addVolunteer(teamId) {
      if (!isAdmin) { showToast('Only admin can add volunteers', 'error'); return; }
      const form = document.getElementById(`add-form-${teamId}`);
      const nameInput = form.querySelector('.add-name');
      const mobileInput = form.querySelector('.add-mobile');
      const workInput = form.querySelector('.add-workarea');
      const name = nameInput.value.trim();
      if (!name) { showToast('Please enter a name', 'error'); return; }
      const maxOrder = (volunteersStore[teamId] || []).length;
      const { error } = await supabaseClient.from('volunteers').insert([{
        team_id: teamId,
        name,
        mobile: mobileInput.value.trim(),
        work_area: workInput.value.trim(),
        sort_order: maxOrder
      }]);
      if (error) { showToast('Add failed: ' + error.message, 'error'); return; }
      nameInput.value = ''; mobileInput.value = ''; workInput.value = '';
      await loadDataFromSupabase();
      renderTabsAndPanels();
      switchTab(teamId);
      showToast(`Added "${name}"`, 'success');
    }

    async function removeVolunteer(teamId, index) {
      if (!isAdmin) return;
      const v = volunteersStore[teamId]?.[index];
      if (!v) return;
      if (!confirm(`Remove "${v.name}" from this team?`)) return;
      const { error } = await supabaseClient.from('volunteers').delete().eq('id', v.dbId);
      if (error) { showToast('Delete failed: ' + error.message, 'error'); return; }
      await loadDataFromSupabase();
      renderTabsAndPanels();
      switchTab(teamId);
      showToast(`Removed "${v.name}"`, 'info');
    }

    async function editVolunteerPrompt(teamId, index) {
      if (!isAdmin) return;
      const v = volunteersStore[teamId]?.[index];
      if (!v) return;

      const newName = prompt('Edit volunteer name:', v.name);
      if (newName === null) return;
      const newMobile = prompt('Edit mobile (leave blank to clear):', v.mobile || '');
      if (newMobile === null) return;
      const newWork = prompt('Edit work area (leave blank to clear):', v.workArea || '');
      if (newWork === null) return;

      const currentIdx = teamsStore.findIndex(t => t.id === teamId);
      const teamChoices = teamsStore.map((t, i) => `${i + 1}. ${t.name}`).join('\n');
      const teamAnswer = prompt(
        `Current team: ${currentIdx >= 0 ? `${currentIdx + 1}. ${teamsStore[currentIdx].name}` : teamId}\nEnter new team number (1-${teamsStore.length}) or team name:\n\n${teamChoices}`,
        currentIdx >= 0 ? String(currentIdx + 1) : teamId
      );
      if (teamAnswer === null) return;

      if (!newName.trim()) { showToast('Name cannot be empty', 'error'); return; }

      const targetTeamId = resolveTargetTeamId(teamAnswer, teamId);
      if (!targetTeamId) {
        showToast('Could not match that team. Edit cancelled.', 'error');
        return;
      }

      const cleanedFields = {
        name: newName.trim(),
        mobile: newMobile.trim(),
        workArea: newWork.trim()
      };

      try {
        if (targetTeamId !== teamId) {
          await moveVolunteerToTeam(v, teamId, targetTeamId, cleanedFields);
          await loadDataFromSupabase();
          renderTabsAndPanels();
          switchTab(targetTeamId);
          const targetTeam = teamsStore.find(t => t.id === targetTeamId);
          showToast(`Moved "${cleanedFields.name}" to ${targetTeam ? targetTeam.name : targetTeamId}`, 'success');
        } else {
          const { error } = await supabaseClient.from('volunteers').update({
            name: cleanedFields.name,
            mobile: cleanedFields.mobile,
            work_area: cleanedFields.workArea
          }).eq('id', v.dbId);
          if (error) throw error;
          await loadDataFromSupabase();
          renderTabsAndPanels();
          switchTab(teamId);
          showToast('Volunteer updated', 'success');
        }
      } catch (err) {
        showToast('Update failed: ' + err.message, 'error');
      }
    }

    async function saveTeamInline(teamId) {

      if (!newName) { showToast('Team name cannot be empty', 'error'); return; }
      if (isNaN(newReq) || newReq < 1) { showToast('Required must be at least 1', 'error'); return; }

      const { error } = await supabaseClient.from('teams').update({
        name: newName, required: newReq
      }).eq('id', teamId);
      if (error) { showToast('Save failed: ' + error.message, 'error'); return; }

    async function addTeam() {
      if (!isAdmin) return;
      const nameInput = document.getElementById('newTeamName');
      const reqInput = document.getElementById('newTeamRequired');
      const respInput = document.getElementById('newTeamResp');
      const name = nameInput.value.trim();
      const required = parseInt(reqInput.value, 10) || 1;
      const respText = respInput.value.trim();
      if (!name) { showToast('Team name is required', 'error'); return; }

      const newId = 'team_' + Date.now();
      const responsibilities = respText
        ? respText.split('\n').map(s => s.trim()).filter(Boolean)
        : ['Responsibilities to be defined.'];

      const maxOrder = teamsStore.reduce((m, t) => Math.max(m, t.sort_order || 0), 0) + 1;
      const { error } = await supabaseClient.from('teams').insert([{
        id: newId, name, required, responsibilities, sort_order: maxOrder
      }]);
      if (error) { showToast('Add failed: ' + error.message, 'error'); return; }

      await loadDataFromSupabase();
      renderTabsAndPanels();
      switchTab('manage');
      showToast(`Team "${name}" added`, 'success');

                refreshManagePanel();
                refreshAllCoordinationBanners();
                openTeamVolunteerEditor(targetTeamId);
                const targetTeam = teamsStore.find(t => t.id === targetTeamId);
                showToast(`Moved "${name}" to ${targetTeam ? targetTeam.name : targetTeamId}`, 'success');
              } else {
                const { error } = await supabaseClient.from('volunteers').update({
                  name, mobile, work_area: work
                }).eq('id', v.dbId);
                if (error) throw error;
                await loadDataFromSupabase();
                openTeamVolunteerEditor(teamId);
                refreshDashboard();
                refreshManagePanel();
                refreshAllCoordinationBanners();
                showToast('Volunteer updated', 'success');
              }
            } catch (err) {
              showToast('Update failed: ' + err.message, 'error');
            }
          });
        });
        tb.querySelectorAll('.vol-del').forEach(btn => {
          btn.addEventListener('click', async () => {
            const i = parseInt(btn.dataset.index, 10);
            const v = volunteersStore[teamId][i];
            if (!confirm(`Remove "${v.name}"?`)) return;
            const { error } = await supabaseClient.from('volunteers').delete().eq('id', v.dbId);
            if (error) { showToast('Delete failed: ' + error.message, 'error'); return; }
            await loadDataFromSupabase();
            openTeamVolunteerEditor(teamId);
            refreshDashboard();
            refreshManagePanel();
            refreshAllCoordinationBanners();
            showToast('Volunteer removed', 'info');
          });
        });
      }
      editor.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ============================================
       UTILITY
    ============================================ */
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    /* ============================================
       BOOTSTRAP
    ============================================ */
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        isAdmin = currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
        await showApp();
      }
    })();
  </script>
</body>
</html>
